name: かくにん待ちの通知

on:
  schedule:
    - cron: "*/5 * * * *"   # 5分ごと（GitHubが混んでいると5〜15分ほど遅れることがある）
  workflow_dispatch:         # 手動でも実行できる

permissions:
  contents: read

concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund firebase-admin@12
      - run: node notify.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
