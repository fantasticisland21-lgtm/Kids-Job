<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="おてつだい">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191919" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<title>おてつだいポイント</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=13">
<link rel="icon" type="image/svg+xml" href="icon.svg?v=13">
<link rel="manifest" href="manifest.json?v=1">
<style>
/* 1列の画面。上に子どもごとの残高カード、下におてつだいの行、いちばん下にタブ。土台はNotion風(v10.7) */
:root{
  color-scheme:light;
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F1F1EF; --soft:#F7F7F5; --fg:#37352F; --muted:#787774; --line:#E9E9E7;
  --accent:#2B54F0; --accent-fg:#FFFFFF;
  --coin:#FFC83D; --coin-fg:#3A2A00;
  --go:#0F7F5B; --go-fg:#FFFFFF;
  --plus:#0F7F5B; --minus:#C2303F;
  --display:-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Sans',system-ui,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Sans',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#191919; --surface:#191919; --surface-2:#2C2C2C; --soft:#202020; --fg:#D4D4D4; --muted:#9B9B9B; --line:#2F2F2F;
    --accent:#86A0FF; --accent-fg:#0A1233; --go:#34C793; --go-fg:#04241A; --plus:#4ADBA6; --minus:#FF8791;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:500 15px/1.55 var(--body);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 120px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 14px}
h1{margin:0;font-size:19px;font-weight:900;letter-spacing:.02em}
h2{margin:22px 0 10px;font-size:14px;font-weight:900;color:var(--muted);letter-spacing:.06em}
.seg{display:flex;background:var(--surface-2);border-radius:999px;padding:3px}
.seg button{min-height:34px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:900;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(10,20,50,.18)}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px;margin-bottom:14px}
.chip{--k:var(--accent);display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 12px;border-radius:999px;background:var(--surface);border:2px solid var(--line);font-weight:900;min-width:0}
.chip i{width:16px;height:16px;border-radius:50%;background:var(--k);flex:none}
.chip b{font-family:var(--display);font-weight:600;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.chip.on{border-color:var(--k)}
.bals{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.balance{--k:var(--accent);min-width:0;cursor:pointer;background-color:var(--k);background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.24) 1.5px,transparent 0);background-size:14px 14px;color:var(--ink,#fff);border-radius:22px;padding:14px 12px 14px}
.balance.sel{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--k)}
.goal{height:8px;border-radius:4px;background:color-mix(in srgb,var(--ink,#fff) 25%,transparent);overflow:hidden;margin-top:12px}
.goal i{display:block;height:100%;background:var(--ink,#fff);border-radius:4px}
.balance .gl{margin-top:6px;font-size:11px;font-weight:700}
.balance .gl b{font-family:var(--display);font-size:13px}
.seg.full{margin-bottom:12px}
.seg.full button{flex:1}
.tbl{background:var(--surface);border-radius:18px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{padding:10px 10px 6px;font-size:11px;font-weight:900;color:var(--muted);text-align:right}
td{padding:10px;border-top:1px solid var(--line);text-align:right;font-family:var(--display);font-weight:600;white-space:nowrap}
th:first-child,td:first-child{text-align:left;font-family:var(--body);font-weight:900}
tr[data-act]{cursor:pointer}
tr.sel td{background:var(--surface-2)}
td.up{color:var(--plus)} td.dn{color:var(--minus)}
.balance p{margin:0}
.bl{font-weight:900;font-size:14px;opacity:.95}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:4px}
.top .bl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.num{display:flex;align-items:flex-end;gap:4px;margin-top:0;flex:none;font-family:var(--display);font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.num small{font-size:14px;font-weight:600;padding-bottom:5px}
.yen{display:inline-block;margin-top:10px;padding:5px 9px;border-radius:14px;line-height:1.4;background:var(--coin);color:var(--coin-fg);font-weight:900;font-size:11px;white-space:nowrap}
.yen b{font-family:var(--display);font-size:14px;font-variant-numeric:tabular-nums}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:18px;padding:10px 12px}
.stamp{flex:none;width:54px;height:54px;border-radius:50%;border:2px dashed var(--accent);display:grid;place-content:center;text-align:center;font-family:var(--display);font-weight:700;font-size:18px;line-height:1;font-variant-numeric:tabular-nums}
.stamp i{font-style:normal;font-size:10px;font-weight:600;color:var(--muted)}
.rt{flex:1;min-width:0;font-weight:700;overflow-wrap:anywhere}
.rt small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.btn{min-height:44px;padding:0 18px;border-radius:14px;font-weight:900;background:var(--go);color:var(--go-fg);white-space:nowrap}
.gives{display:flex;gap:6px}
.btn.kb[disabled]{background:var(--surface-2);color:var(--muted);box-shadow:inset 0 0 0 2px var(--k)}
.btn.kb{background:var(--k);color:var(--ink,#fff);padding:0 4px;width:78px;flex:none;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;min-height:48px}
.btn.kb .nm{font-size:11px;font-weight:700;opacity:.9;display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn.kb small{font-size:15px;font-weight:900}
.btn.acc{background:var(--accent);color:var(--accent-fg)}
.btn.quiet{background:var(--surface-2);color:var(--fg)}
.btn[disabled]{background:var(--surface-2);color:var(--muted);cursor:default}
.btn.wide{width:100%;min-height:52px;font-size:16px}
.ver{display:block;margin-top:1px;color:var(--muted);font-size:11px;font-weight:600;font-family:var(--display);letter-spacing:.02em}
.btn.wide.armed{background:var(--minus);color:#fff}
.hint{color:var(--muted);text-align:center;padding:24px 8px;margin:0}
.err{color:var(--minus);font-weight:900;margin:0}
.panel{background:var(--surface);border-radius:22px;padding:18px}
.stamp.f{font-size:13px;letter-spacing:-.02em}
.pick{display:block;background:var(--surface-2);border-radius:18px;padding:12px}
.pick .stepper output{font-size:40px}
.pick .stepper button.rd{width:48px;height:48px;font-size:24px}
.pick .qk{display:flex;gap:8px;margin-top:10px}
.pick .qk button{flex:1}
.mini{font-size:12px;color:var(--muted);margin:2px 0 0}
.srow.cr{flex-wrap:wrap}
.srow.cr .in:not(.n){flex:1 1 100%}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stepper button.rd{flex:none;width:56px;height:56px;border-radius:50%;background:var(--surface-2);font:600 28px var(--display);display:grid;place-items:center}
.stepper output{display:block;text-align:center;font-family:var(--display);font-weight:700;font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.stepper output small{font-size:18px;color:var(--muted);font-weight:600}
.conv{text-align:center;margin:12px 0 16px;font-weight:900}
.conv b{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.sub{display:flex;justify-content:space-between;gap:8px;margin:0 0 14px;color:var(--muted);font-size:13px;font-weight:700}
.actions{display:flex;gap:8px}
.ent .d{display:block;color:var(--muted);font-size:12px;font-weight:500}
.delta{font-family:var(--display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
.delta.p{color:var(--plus)} .delta.m{color:var(--minus)}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-size:11px;font-weight:900;margin-right:6px}
.k{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px;background:var(--k,var(--accent))}
.srow{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:16px;padding:8px 10px}
.sw{flex:none;width:40px;height:40px;border-radius:50%;background:var(--k);border:3px solid var(--surface-2)}
.in{min-width:0;flex:1;min-height:44px;padding:0 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-size:16px}
.in.n{flex:none;width:72px;padding:0 6px;text-align:center;font-variant-numeric:tabular-nums}
.ghost{flex:none;min-height:40px;padding:0 10px;border-radius:12px;color:var(--muted);font-weight:900;font-size:13px}
.ghost.armed{background:var(--minus);color:var(--bg)}
.fld{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 10px;font-weight:700}
.stack{display:flex;flex-direction:column;gap:12px}
label.l{font-size:12px;font-weight:900;color:var(--muted)}
.kagi{-webkit-text-security:disc}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs nav{max-width:520px;margin:0 auto;display:flex}
.tab{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;color:var(--muted);font-size:11px;font-weight:900}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent)}
.badge{position:absolute;top:4px;left:calc(50% + 8px);width:11px;height:11px;border-radius:50%;background:#E5362B;box-shadow:0 0 0 2px var(--surface,#fff);font-size:0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:9;max-width:calc(100% - 32px);padding:10px 16px;border-radius:14px;background:var(--fg);color:var(--bg);font-weight:900;text-align:center}
@media (prefers-reduced-motion:no-preference){.btn,.chip,.rd{transition:transform .08s}.btn:active,.rd:active{transform:scale(.96)}}

#fx{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(20,28,51,.45);overflow:hidden;animation:fxin .25s ease-out}
.fxcard{position:relative;z-index:1;background:var(--k);color:var(--ink,#fff);border-radius:28px;padding:26px 34px;text-align:center;box-shadow:0 14px 40px rgba(0,0,0,.3);animation:fxpop .55s cubic-bezier(.2,1.5,.4,1)}
.fxcard p{margin:0}
.fxt{font:700 30px/1.1 var(--display)}
.fxn{margin-top:8px;font-weight:900;font-size:18px}
.fxy{margin-top:12px;display:inline-block;padding:6px 14px;border-radius:16px;background:var(--coin);color:var(--coin-fg);font-weight:900;font-size:14px}
.fxy b{font-family:var(--display);font-size:22px}
.fxs{margin-top:12px;font-size:11px;opacity:.8}
.cf{position:absolute;top:-20px;border-radius:2px;opacity:0;animation-name:cfall;animation-timing-function:linear;animation-fill-mode:forwards}
@keyframes cfall{0%{opacity:1;translate:0 0}100%{opacity:1;translate:var(--dx,30px) 110vh}}
@keyframes fxin{from{opacity:0}to{opacity:1}}
@keyframes fxpop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.cf{display:none}.fxcard{animation:none}}

/* ---- Notion風(v10.7): 白とグレーの土台。子どもの色・ボタンの色・黄色のラベルはそのまま ---- */
body{font-weight:400;font-size:15px}
h1{font-weight:700;font-size:18px;letter-spacing:0}
h2{margin:24px 0 8px;font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--muted)}
.row,.srow,.panel,.tbl{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:none}
.list{gap:8px}
.panel{padding:16px}
.balance{border-radius:12px}
.balance.sel{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--k)}
.bl,.yen{font-weight:700}
.stamp{width:52px;height:52px;border:0;border-radius:8px;background:var(--surface-2);color:var(--fg);font-weight:700}
.rt{font-weight:500}
.btn{border-radius:8px;font-weight:700}
.btn.kb{border-radius:8px}
.btn.kb small{font-weight:700}
.seg{border-radius:8px;padding:2px}
.seg button{border-radius:6px;font-weight:600}
.seg button.on{box-shadow:0 1px 2px rgba(15,15,15,.12)}
.chip{border:1px solid var(--line);border-radius:8px;font-weight:600}
.chip.on{border-color:var(--k);box-shadow:inset 0 0 0 1px var(--k)}
.in{border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.in:focus{outline:none;border-color:#2383E2;box-shadow:0 0 0 2px rgba(35,131,226,.2)}
.pick{background:var(--soft);border:1px solid var(--line);border-radius:10px}
.stepper button.rd{border-radius:8px;background:var(--surface-2);font-weight:500}
.stepper output,.num,.delta,.conv b{font-weight:700}
.tag{border-radius:4px;font-weight:600}
.ghost{border-radius:6px;font-weight:600}
.err,.conv,.sub,label.l,.fld{font-weight:600}
th,th:first-child,td:first-child{font-weight:600}
.tab{font-weight:600}
.sw{border:2px solid var(--line)}
#toast{border-radius:8px;font-weight:600;box-shadow:0 4px 16px rgba(15,15,15,.2)}
/* ---- 総点検(v10.10): 押しやすさ・読みやすさ ---- */
.balance{border-radius:10px}
.ghost{min-height:44px}
.seg button{min-height:44px}
.btn.wide.armed{color:var(--bg)}
.btn.kb[disabled] small{font-size:11px}
.stepper button.rd[disabled]{opacity:.35;cursor:default}
.stamp.f{font-size:13px;line-height:1.05}
/* v10.11: 子どもが読む小さい文字を大きく */
.tab{font-size:12px}
.btn.kb .nm{font-size:12px}
.balance .gl{font-size:12px}
.yen{font-size:12px}
.stamp i{font-size:11px}
.tag,th,.fxs{font-size:12px}
.mini{font-size:13px}
/* v10.11: iPadでは幅を広げる */
@media (min-width:700px){.wrap,.tabs nav{max-width:660px}}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs{padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="top">
    <h1>おてつだいポイント<span class="ver" id="ver"></span></h1>
    <div id="mode"></div>
  </header>
  <main id="view"><p class="hint">よみこみ中…</p></main>
</div>
<div class="tabs"><nav id="tabs" aria-label="メニュー"></nav></div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";
import {getFirestore,collection,doc,onSnapshot,addDoc,setDoc,updateDoc,deleteDoc,runTransaction,query,orderBy,limit,writeBatch,increment,FieldPath,deleteField} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";
import {getMessaging,getToken,isSupported} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-messaging.js";

/* ---------- Firebase 設定 ---------- */
var firebaseConfig={
  apiKey:"AIzaSyCNJjf-TecemMF04jvuvXV3ZfeokluJMBs",
  authDomain:"kids-job.firebaseapp.com",
  projectId:"kids-job",
  storageBucket:"kids-job.firebasestorage.app",
  messagingSenderId:"341087334902",
  appId:"1:341087334902:web:a9ed53c6c70f571ea697d7"
};
/* ログインに使う2つのアカウント(メールは本物でなくてOK)。
   Firebaseの「ルール」にも、同じ PARENT_EMAIL を書いてあります。 */
var APP_VERSION='v11';
var PARENT_EMAIL='oya@example.com';
var KID_EMAIL='kodomo@example.com';

var fbApp=initializeApp(firebaseConfig);
var auth=getAuth(fbApp);
var fs=getFirestore(fbApp);

/* ---------- 通知とバッジ(v11) ----------
   おとなの端末を settings/push の devices に登録しておくと、GitHub Actions(notify.js)が
   5分ごとに新しいお願いを調べて通知する。ホーム画面のアイコンには、かくにん待ちの件数を出す。
   VAPID_KEY は Firebase の「プロジェクトの設定 → Cloud Messaging → ウェブプッシュ証明書」の鍵 */
var VAPID_KEY='';
var PUSH_DOC=doc(fs,'settings','push');
function today(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function tokKey(t){var h=0;for(var i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))|0;return 'd'+(h>>>0).toString(36)+t.length}
function standalone(){return window.navigator.standalone===true||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)}
function pushOn(){return 'Notification' in window&&Notification.permission==='granted'&&!!store('otm.pushKey')}
function withTimeout(p,ms){return Promise.race([p,new Promise(function(_,ng){setTimeout(function(){ng(new Error('timeout'))},ms)})])}
/* この端末の通知の登録(トークン)を取り、settings/push に保存する */
function pushSave(){
  return isSupported().then(function(ok){
    if(!ok||!('serviceWorker' in navigator))throw new Error('unsupported');
    return navigator.serviceWorker.register('firebase-messaging-sw.js')})
  .then(function(reg){return getToken(getMessaging(fbApp),{vapidKey:VAPID_KEY,serviceWorkerRegistration:reg})})
  .then(function(t){
    if(!t)throw new Error('notoken');
    var key=tokKey(t),old=store('otm.pushKey'),data={devices:{}};
    data.devices[key]={token:t,ts:Date.now()};
    return setDoc(PUSH_DOC,data,{merge:true}).then(function(){
      store('otm.pushKey',key);store('otm.pushDay',today());
      if(old&&old!==key)return updateDoc(PUSH_DOC,new FieldPath('devices',old),deleteField()).catch(function(){})})})}
/* 「通知を登録」ボタン。iPhoneは押した直後に許可を聞かないと出ないので、最初に聞く */
function pushRegister(){
  if(!('Notification' in window)||!standalone()){toast('ホーム画面の「おてつだい」から開いて、もういちど押してね');return}
  if(!VAPID_KEY){toast('通知の鍵がまだ入っていません');return}
  Notification.requestPermission().then(function(p){
    if(p!=='granted'){toast('通知が許可されませんでした。iPhoneの設定アプリの「通知」から許可してね');render(true);return}
    S.pushBusy=true;render(true);
    return pushSave().then(function(){toast('この端末に通知がとどくようにしたよ')}).catch(function(e){
      toast(e&&e.code==='permission-denied'?'保存できませんでした(Firebaseのルール)':'通知を登録できませんでした')})
    .then(function(){S.pushBusy=false;render(true)})})}
/* ひらいたときに1日1回、登録を新しくする(トークンが変わっても通知が止まらないように) */
function pushRefresh(){
  if(!S.canEdit||!VAPID_KEY||!pushOn()||store('otm.pushDay')===today())return;
  pushSave().catch(function(){})}
/* ログアウトの前に、この端末への通知を止める(電波がなくても3秒でログアウトに進む) */
function pushRemove(){
  var key=store('otm.pushKey');if(!key||!S.canEdit)return Promise.resolve();
  store('otm.pushKey','');
  return withTimeout(updateDoc(PUSH_DOC,new FieldPath('devices',key),deleteField()),3000).catch(function(){})}
/* ホーム画面のアイコンの数字。おとなのアカウントだけ、かくにん待ちの件数を出す */
var lastBadge=null;
function badge(n){try{
  if(!('setAppBadge' in navigator)||n===lastBadge)return;lastBadge=n;
  (n>0?navigator.setAppBadge(n):navigator.clearAppBadge()).catch(function(){})}catch(e){}}

  if(S.user&&S.canEdit){if(S.got&&S.got.reqs)badge(S.reqs.length)}
  else badge(0)}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'){lastBadge=null;badgeSync()}});

/* Firestore を、ページの中で使いやすい形にまとめる */
function docApi(ref){return{
  set:function(d){return setDoc(ref,d)},
  update:function(d){return updateDoc(ref,d)},
  delete:function(){return deleteDoc(ref)},
  onSnapshot:function(next,err){return onSnapshot(ref,function(s){next({exists:s.exists(),data:function(){return s.data()}})},err)}
}}
var adapter={
  collection:function(p){var ref=collection(fs,p);return{
    onSnapshot:function(next,err){return onSnapshot(ref,function(s){next({docs:s.docs.map(function(d){return{id:d.id,data:function(){return d.data()}}})})},err)},
    add:function(d){return addDoc(ref,d)},
    doc:function(id){return docApi(doc(fs,p,id))}
  }},
  doc:function(path){var a=path.split('/');return docApi(doc(fs,a[0],a[1]))}
};

var XLAB='おこづかいに こうかん';

var COLORS=['#E5483D','#0E8C88','#6B3FE0','#D9650F','#D6337F','#2E8B3E','#C4A8F5','#F7B0CF','#9ED6F2'];
var AC=null;
function levelUp(){try{
  var A=window.AudioContext||window.webkitAudioContext;if(!A)return;
  if(!AC)AC=new A();if(AC.state==='suspended')AC.resume();
  var t0=AC.currentTime+0.02,notes=[523.25,659.25,783.99,1046.5,1318.5];
  notes.forEach(function(f,i){
    var o=AC.createOscillator(),g=AC.createGain(),t=t0+i*0.085,last=i===notes.length-1;
    o.type='square';o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.09,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+(last?0.5:0.11));
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+(last?0.52:0.12))})
}catch(e){}}
function ink(c){var m=/^#(..)(..)(..)$/.exec(c||'');if(!m)return '#fff';var l=(0.299*parseInt(m[1],16)+0.587*parseInt(m[2],16)+0.114*parseInt(m[3],16));return l>165?'#2A2250':'#fff'}

function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}

function bal(id){var k=kidById(id);if(k&&k.agg===1)return +k.bal||0;return S.ledger.reduce(function(a,e){return e.kid===id?a+(+e.delta||0):a},0)}

function errText(e){var c=e&&e.code;
  if(c==='permission-denied')return 'このアカウントでは できません';
  if(c==='resource-exhausted')return 'きょうは たくさん つかったので、あした また ためしてね';
  if(c==='unavailable'||c==='deadline-exceeded')return 'つながりませんでした。もういちど ためしてね';
  if(c==='gone')return 'もう とりけされていました';
  return 'うまくいきませんでした'}
/* ボタンからの保存。終わるまで次のボタンは待たせる。電波が弱くて6秒たっても終わらないときは、待たせるのをやめる */
function run(fn,ok){
  if(S.busy){toast('ちょっと まってね');return Promise.resolve(false)}
  S.busy=true;var done=false;
  var slow=setTimeout(function(){if(!done){S.busy=false;toast('つながるのを まっているよ');render()}},6000);
  return Promise.resolve().then(fn).then(function(){done=true;if(ok)toast(ok);return true},function(e){done=true;toast(errText(e));return false})
    .then(function(v){clearTimeout(slow);S.busy=false;render();return v})}
/* せってい画面の入力欄の保存。ほかの保存中でも捨てずに送る */
function save(fn){return Promise.resolve().then(fn).catch(function(e){toast(errText(e));render(true)})}
function armed(key){

function balCard(x,sel){

   +'<p class="gl">つぎの <b>'+(st0*rate())+'</b>円まで あと <b>'+(st0-rem)+'</b>pt</p></div>'}

function monthKey(ts){var d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function monthAgg(ents){
  var by={};
  ents.forEach(function(e){
    var key=monthKey(e.ts||0),m=by[key]||(by[key]={earn:0,spent:0,yen:0,adj:0,chores:{}}),d=+e.delta||0;
    if(e.kind==='exchange'){m.spent+=-d;m.yen+=(e.yen!=null?+e.yen:-d*rate())}
    else if(e.kind==='adjust'){m.adj+=d}
    else{m.earn+=d;var c=m.chores[e.label]||(m.chores[e.label]={n:0,pt:0});c.n++;c.pt+=d}
  });
  return by}
function signed(v){return (v>=0?'+':'−')+Math.abs(v)}
function monthBody(k){
  var by=k.agg===1?(k.mon||{}):monthAgg(S.ledger.filter(function(e){return e.kid===k.id}));
  Object.keys(by).forEach(function(key){var m=by[key]||{};by[key]={earn:+m.earn||0,spent:+m.spent||0,yen:+m.yen||0,adj:+m.adj||0,chores:m.chores||{}}});
  var keys=Object.keys(by).filter(function(key){var m=by[key]||{};return m.earn||m.spent||m.adj||m.yen}).sort().reverse().slice(0,12);
  if(!keys.length)return '<p class="hint">まだ きろくがありません</p>';
  if(!S.month||keys.indexOf(S.month)<0)S.month=keys[0];
  var h='<div class="tbl"><table><thead><tr><th>つき</th><th>もらった</th><th>こうかん</th><th>わたした</th></tr></thead><tbody>'+keys.map(function(key){
    var m=by[key],p=key.split('-'),v=m.earn+m.adj;
    return '<tr class="'+(key===S.month?'sel':'')+'" data-act="month" data-v="'+key+'" role="button" tabindex="0"><td>'+p[0]+'年'+(+p[1])+'月</td><td class="'+(v>=0?'up':'dn')+'">'+signed(v)+'pt</td><td class="dn">'+(m.spent?'−'+m.spent+'pt':'0pt')+'</td><td>'+m.yen+'円</td></tr>'}).join('')+'</tbody></table></div>';
  var m=by[S.month],p=S.month.split('-');
  var items=Object.keys(m.chores).filter(function(n){return (+m.chores[n].n||0)>0}).map(function(n){return {n:n,c:m.chores[n]}}).sort(function(a,b){return b.c.pt-a.c.pt});
  var rows=items.map(function(it){return '<li class="row ent"><span class="rt">'+esc(it.n)+'<span class="d">'+it.c.n+'回</span></span><span class="delta '+(it.c.pt>=0?'p':'m')+'">'+signed(it.c.pt)+'</span></li>'}).join('')
    +(m.adj?'<li class="row ent"><span class="rt">ちょうせい</span><span class="delta '+(m.adj>0?'p':'m')+'">'+signed(m.adj)+'</span></li>':'')
    +(m.spent?'<li class="row ent"><span class="rt">'+XLAB+'<span class="d">'+m.yen+'円 わたした</span></span><span class="delta m">−'+m.spent+'</span></li>':'');
  return h+'<h2>'+p[0]+'年'+(+p[1])+'月の うちわけ</h2><ul class="list">'+rows+'</ul>'}
/* ポイントが変わるおてつだい(points=いちばん少ない, max=いちばん多い) */
function cMax(c){var m=+(c&&c.max)||0,p=+(c&&c.points)||0;return m>p?m:0}
function cStep(c){var a=+c.points||0,b=cMax(c);return (a%10===0&&b%10===0)?10:(a%5===0&&b%5===0)?5:1}
function cLabel(c){var m=cMax(c);return m?(+c.points||0)+'〜'+m:String(+c.points||0)}
function choreOf(r){return r&&r.kind==='chore'?S.chores.find(function(x){return x.id===r.choreId}):null}
/* OKで使うポイント。お願いに書かれた数をそのまま信じず、おてつだいの設定から決める(使えないお願いは null) */
function okPts(r){
  if(r.kind==='exchange'){var x=int(r.points,0);return (x>0&&x%step()===0)?x:null}
  var c=choreOf(r);
  if(!c){var q=int(r.points,0);return q>0?q:null}
  var mn=+c.points||0,mx=cMax(c);
  if(!mx)return mn;
  var v=S.rp[r.id]!=null?S.rp[r.id]:(+r.points||0);
  return Math.max(mn,Math.min(mx,v))}
function reqPts(r){var p=okPts(r);return p==null?0:p}
function pickBox(c,v,act,id,kid,okLab){

   +'<p class="mini" style="text-align:center">'+mn+'〜'+mx+'pt の あいだで えらべるよ</p>'}

function render(force){
  var a=document.activeElement;
  if(!force&&a&&view.contains(a)&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)){S.dirty=true;return}
  S.dirty=false;
  if(!S.authReady){view.innerHTML='<p class="hint">よみこみ中…</p>';tabsEl.innerHTML='';modeEl.innerHTML='';return}
  if(!S.user){view.innerHTML=loginView();tabsEl.innerHTML='';modeEl.innerHTML='';badge(0);return}
  var need=['kids','chores','reqs','ledger','cfg'],ready=need.every(function(n){return S.got[n]});
  var k=cur();
  modeEl.innerHTML=S.canEdit?'<div class="seg" role="group" aria-label="モード"><button data-act="mode" data-v="kid" class="'+(S.parent?'':'on')+'">こども</button><button data-act="mode" data-v="parent" class="'+(S.parent?'on':'')+'">おとな</button></div>':'';
  var tabs=[['home','ホーム'],['ex','こうかん'],['hist','きろく']];
  if(S.parent){tabs.push(['ok','かくにん']);tabs.push(['set','せってい'])}
  if(!tabs.some(function(t){return t[0]===S.tab}))S.tab='home';
  tabsEl.innerHTML=tabs.map(function(t){
    var n=t[0]==='ok'?S.reqs.length:0;
    return '<button class="tab'+(S.tab===t[0]?' on':'')+'" data-act="tab" data-v="'+t[0]+'"><svg viewBox="0 0 24 24" aria-hidden="true">'+ICONS[t[0]]+'</svg>'+t[1]+(n?'<span class="badge" aria-label="かくにんまちあり"></span>':'')+'</button>'}).join('');
  var h;
  if(S.err)h='<p class="hint">よみこめませんでした。ログインしなおすか、ひらきなおしてね。</p>'+logoutBtn();
  else if(!ready)h='<p class="hint">よみこみ中…</p>';
  else if(!k)h=seedView()+logoutBtn();
  else h=S.tab==='home'?homeView(k):S.tab==='ex'?exView(k):S.tab==='hist'?histView(k):S.tab==='ok'?okView():setView();
  if(S.shown==='set'&&S.tab==='set')keepGet();else if(S.tab!=='set')S.keep={};
  view.innerHTML=h;S.shown=(ready&&k&&!S.err)?S.tab:null;
  badgeSync();
  if(S.shown==='set')keepPut()}
/* せっていの「新しいおてつだい」「ちょうせい」の入力が、画面の描き直しで消えないようにする */
var KEEP=['nc-t','nc-p','nc-m','adj-k','adj-s','adj-p','adj-m'];
function keepGet(){KEEP.forEach(function(id){var e=document.getElementById(id);if(e)S.keep[id]=e.value})}
function keepPut(){KEEP.forEach(function(id){var e=document.getElementById(id),v=S.keep[id];if(!e||v==null)return;
  if(e.tagName==='SELECT'&&!Array.prototype.some.call(e.options,function(o){return o.value===v}))return;e.value=v})}

/* ---------- writes ---------- */
/* きろく1件ぶんを、子どものデータの合計(残高・月ごと)に足す/引く。s=1で足す、-1で引く */
function aggPairs(e,s){
  var key=monthKey(e.ts||0),d=+e.delta||0,a=[[new FieldPath('bal'),s*d]];
  function m(){return new FieldPath('mon',key,...arguments)}
  if(e.kind==='exchange'){a.push([m('spent'),s*(-d)],[m('yen'),s*(e.yen!=null?+e.yen:-d*rate())])}
  else if(e.kind==='adjust'){a.push([m('adj'),s*d])}
  else{var l=String(e.label||'おてつだい');a.push([m('earn'),s*d],[m('chores',l,'n'),s],[m('chores',l,'pt'),s*d])}
  return a}
function applyAgg(w,e,s){var k=kidById(e.kid);if(!k||k.agg!==1)return;
  var args=[doc(fs,'kids',e.kid)];aggPairs(e,s).forEach(function(x){args.push(x[0],increment(x[1]))});w.update.apply(w,args)}
function addLedger(id,kid,delta,kind,label,extra){
  var data=Object.assign({kid:kid,delta:delta,kind:kind,label:label,ts:Date.now()},extra||{});
  var ref=id?doc(fs,'ledger',id):doc(collection(fs,'ledger'));
  var b=writeBatch(fs);b.set(ref,data);applyAgg(b,data,1);return b.commit()}
/* きろくを消す(残高も一緒に戻す)。2台で同時に消しても二重に引かない */
function removeLedger(id){
  var ref=doc(fs,'ledger',id);
  return runTransaction(fs,function(tx){return tx.get(ref).then(function(s){
    if(!s.exists())return;var e=s.data();tx.delete(ref);applyAgg(tx,e,-1)})})}
/* はじめの1回だけ: 今までのきろくから、子どもごとの残高と月ごとの合計を作る(おとなの端末で自動) */
function maybeMigrate(){
  if(!S.canEdit||S.migrating||S.ledgerMode!=='full'||!S.got.ledger||!S.got.kids||!S.got.cfg||!S.kids.length||aggReady())return;
  S.migrating=true;
  var b=writeBatch(fs);
  S.kids.forEach(function(k){if(k.agg===1)return;
    var ents=S.ledger.filter(function(e){return e.kid===k.id});
    b.update(doc(fs,'kids',k.id),{bal:ents.reduce(function(a,e){return a+(+e.delta||0)},0),mon:monthAgg(ents),agg:1})});
  b.commit().catch(function(){}).then(function(){S.migrating=false})}
/* お願いをOKにする: お願いがまだあるか確かめてから、きろくを書いて、お願いを消す(まとめて1回で) */
function approve(r,p){
  var reqRef=doc(fs,'requests',r.id),ledRef=doc(fs,'ledger',r.id),c=choreOf(r);
  var data=r.kind==='exchange'?{kid:r.kid,delta:-p,kind:'exchange',label:XLAB,yen:p*rate(),ts:Date.now()}
    :{kid:r.kid,delta:p,kind:'earn',label:c?c.title:String(r.label||'おてつだい'),ts:Date.now()};
  return runTransaction(fs,function(tx){return tx.get(reqRef).then(function(s){
    if(!s.exists()){var e=new Error('gone');e.code='gone';throw e}
    tx.set(ledRef,data);applyAgg(tx,data,1);tx.delete(reqRef)})}).then(function(){delete S.rp[r.id]})}
function saveCfg(patch){return S.db.doc('settings/main').set(Object.assign({yenPerPoint:rate(),step:step()},patch))}
function seedAll(){
  var db=S.db,w=[],hasChores=S.chores.length>0,hasCfg=S.cfgExists;
  w.push(function(){return db.collection('kids').doc('k1').set({name:'こども1',color:COLORS[0],order:1,agg:1,bal:0,mon:{}})});
  w.push(function(){return db.collection('kids').doc('k2').set({name:'こども2',color:COLORS[1],order:2,agg:1,bal:0,mon:{}})});
  if(!hasChores)[['c1','おさらをはこぶ',5],['c2','せんたくものをたたむ',10],['c3','ゴミだし',10],['c4','おふろそうじ',20],['c5','くつをそろえる',3]].forEach(function(c,i){
    w.push(function(){return db.collection('chores').doc(c[0]).set({title:c[1],points:c[2],order:i+1})})});
  if(!hasCfg)w.push(function(){return db.doc('settings/main').set({yenPerPoint:1,step:10})});
  return w.reduce(function(p,f){return p.then(f)},Promise.resolve())}

document.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-act]');if(!t)return;
  var act=t.dataset.act,id=t.dataset.id,k=cur(),c;
  if(act==='who'){S.who=t.dataset.v;S.loginErr='';store('otm.who',S.who);render(true);return}
  if(act==='login'){doLogin();return}
  if(act==='logout'){pushRemove().then(function(){stopSubs();badge(0);return signOut(auth)}).catch(function(){});return}
  if(act==='push'){if(!S.pushBusy)pushRegister();return}
  if(act==='tab'){S.tab=t.dataset.v;S.arm=null;render(true);window.scrollTo(0,0);return}
  if(act==='kid'){S.sel=id;store('otm.kid',id);S.xp=null;render(true);return}
  if(act==='hv'){S.hv=t.dataset.v==='month'?'month':'list';render(true);return}
  if(act==='month'){S.month=t.dataset.v;render(true);return}
  if(act==='mode'){S.parent=t.dataset.v==='parent';store('otm.mode',S.parent?'parent':'kid');S.tab='home';S.arm=null;render(true);return}
  if(act==='seed'&&S.db&&S.parent)return run(seedAll,'見本を作ったよ');
  if(!S.db||!k)return;
  if(act==='chore'){
    c=S.chores.find(function(x){return x.id===id});if(!c)return;
    if(S.busy){toast('ちょっと まってね');return}
    if(!(S.parent&&cMax(c)))levelUp();
    var gk=kidById(t.dataset.kid)||k;
    if(S.parent&&cMax(c)){S.give=(S.give&&S.give.cid===c.id&&S.give.kid===gk.id)?null:{cid:c.id,kid:gk.id,v:+c.points||0};render(true);return}
    if(S.parent)return run(function(){return addLedger(null,gk.id,+c.points,'earn',c.title)},gk.name+'に '+c.points+'pt あげたよ');
    return run(function(){return S.db.collection('requests').add({kid:gk.id,kind:'chore',choreId:c.id,label:c.title,points:+c.points,ts:Date.now()})},'おうちのひとに しらせたよ')}
  if(act==='xp'){var av=Math.max(0,bal(k.id)-pendX(k.id)),stp=step(),mx=Math.floor(av/stp)*stp;S.xp=Math.max(Math.min(stp,mx),Math.min(mx,(S.xp||0)+int(t.dataset.d,0)));render(true);return}
  if(act==='xmax'){var av2=Math.max(0,bal(k.id)-pendX(k.id));S.xp=av2-(av2%step());render(true);return}
  if(act==='xgo'){
    var pts=S.xp||0,av3=Math.max(0,bal(k.id)-pendX(k.id));
    if(pts<=0||pts>av3||pts%step()!==0){toast(step()+'ptずつ こうかんできるよ');return}
    if(S.parent)return run(function(){return addLedger(null,k.id,-pts,'exchange',XLAB,{yen:pts*rate()})},pts*rate()+'円 わたしたよ').then(function(v){if(v){S.xp=null;render(true)}});
    return run(function(){return S.db.collection('requests').add({kid:k.id,kind:'exchange',points:pts,yen:pts*rate(),label:XLAB,ts:Date.now()})},'おうちのひとに しらせたよ').then(function(v){if(v){S.xp=null;render(true)}})}
  if(act==='gv'||act==='rv'){
    var gc=act==='gv'?S.chores.find(function(x){return x.id===id}):choreOf(S.reqs.find(function(x){return x.id===id}));if(!gc||!cMax(gc))return;
    var cv=act==='gv'?(S.give?S.give.v:+gc.points):reqPts(S.reqs.find(function(x){return x.id===id}));cv=Math.max(+gc.points||0,Math.min(cMax(gc),cv));
    var nv=Math.max(+gc.points||0,Math.min(cMax(gc),cv+int(t.dataset.d,0)));
    if(act==='gv'){if(S.give)S.give.v=nv}else S.rp[id]=nv;render(true);return}
  if(act==='gx'){S.give=null;render(true);return}
  if(act==='gok'){
    var g=S.give;if(!g)return;var gc2=S.chores.find(function(x){return x.id===g.cid}),gk2=kidById(g.kid);if(!gc2||!gk2){S.give=null;render(true);return}
    if(S.busy){toast('ちょっと まってね');return}
    var gv=cMax(gc2)?Math.max(+gc2.points||0,Math.min(cMax(gc2),g.v)):(+gc2.points||0);S.give=null;levelUp();
    return run(function(){return addLedger(null,gk2.id,gv,'earn',gc2.title)},gk2.name+'に '+gv+'pt あげたよ')}
  if(act==='cancel')return run(function(){return S.db.doc('requests/'+id).delete()},'とりけしたよ');
  if(act==='ng')return run(function(){return S.db.doc('requests/'+id).delete()},'もどしたよ');
  if(act==='ok'){
    var r=S.reqs.find(function(x){return x.id===id});if(!r)return;
    var rk=kidById(r.kid);if(!rk){toast('この子は いないので「ちがう」を おしてね');return}
    var p1=okPts(r);if(p1==null){toast('このおねがいは つかえないので「ちがう」を おしてね');return}
    if(r.kind==='exchange'&&bal(r.kid)<p1){toast('ポイントがたりません');return}
    return run(function(){return approve(r,p1)},'OKにしたよ')}
  if(act==='okall'){
    if(!armed('all'))return;
    var bl={},todo=[],skip=0;
    S.reqs.slice().sort(function(a,b){return (a.ts||0)-(b.ts||0)}).forEach(function(r){
      var p=okPts(r);if(!kidById(r.kid)||p==null){skip++;return}
      if(bl[r.kid]==null)bl[r.kid]=bal(r.kid);
      if(r.kind==='exchange'){if(bl[r.kid]<p){skip++;return}bl[r.kid]-=p}else bl[r.kid]+=p;
      todo.push(r)});
    if(!todo.length){toast('OKにできるものが ありません');return}
    var gone=0,amt={};todo.forEach(function(r){amt[r.id]=okPts(r)});
    return run(function(){return todo.reduce(function(pr,r){return pr.then(function(){
      return approve(r,amt[r.id]).catch(function(e){if(e&&e.code==='gone'){gone++;return}throw e})})},Promise.resolve())
      .then(function(){toast((todo.length-gone)+'件 OKにしたよ'+(skip?'('+skip+'件は のこしたよ)':''))})})}
  if(act==='undo'){if(armed('u'+id))return run(function(){return removeLedger(id)},'けしたよ');return}
  if(act==='kcolor'){var kk=kidById(id);if(!kk)return;var i=COLORS.indexOf(kidColor(kk));return run(function(){return S.db.doc('kids/'+id).update({color:COLORS[(i+1)%COLORS.length]})})}
  if(act==='cdel'){if(armed('c'+id))return run(function(){return S.db.doc('chores/'+id).delete()},'さくじょしたよ');return}
  if(act==='cadd'){
    var title=document.getElementById('nc-t').value.trim(),pp=int(document.getElementById('nc-p').value,0),pm=int(document.getElementById('nc-m').value,0);
    if(!title||pp<1){toast('名前とポイントを入れてね');return}
    var ord=S.chores.reduce(function(m,x){return Math.max(m,+x.order||0)},0)+1;
    if(document.activeElement)document.activeElement.blur();
    return run(function(){return S.db.collection('chores').add({title:title,points:pp,max:pm>pp?pm:0,order:ord})},'追加したよ').then(function(v){if(v){S.keep['nc-t']='';S.keep['nc-p']='10';S.keep['nc-m']='';render(true)}})}
  if(act==='adj'){
    var kid=document.getElementById('adj-k').value,sg=int(document.getElementById('adj-s').value,1),ap=int(document.getElementById('adj-p').value,0),memo=document.getElementById('adj-m').value.trim();
    if(ap<1){toast('ポイントを入れてね');return}
    if(document.activeElement)document.activeElement.blur();
    return run(function(){return addLedger(null,kid,sg*ap,'adjust',memo||(sg>0?'ボーナス':'ちょうせい'))},'ちょうせいしたよ').then(function(v){if(v){S.keep['adj-p']='';S.keep['adj-m']='';render(true)}})}
});

    render(true)})}

function byOrder(a,b){return (a.order||0)-(b.order||0)||String(a.title||a.name||'').localeCompare(String(b.title||b.name||''))}
function list(s){return s.docs.map(function(d){var o=d.data()||{};o.id=d.id;return o})}
function sub(name,q,fn){
  return q.onSnapshot(function(s){fn(s);S.got[name]=true;try{rewardCheck()}catch(e){}try{maybeMigrate()}catch(e){}render()},function(e){
    if(!S.user)return;
    S.err=(e&&e.code)||'error';render();
    /* 一時的なエラーなら、少し待って読み込み直す */
    if(S.err!=='permission-denied'){clearTimeout(S.retryT);S.retryT=setTimeout(function(){if(S.user&&S.err)startSubs()},5000)}})}
/* ---------- ごほうび演出: 交換単位に届いた瞬間 ---------- */
function rewardCheck(){
  if(!['kids','ledger','cfg'].every(function(n){return S.got[n]}))return;
  var st=step(),cur2={};
  S.kids.forEach(function(x){cur2[x.id]=Math.floor(Math.max(0,bal(x.id))/st)});
  if(!S.rw||S.rw.st!==st){S.rw={st:st,u:cur2};return}
  var hit=null;
  S.kids.forEach(function(x){var p=S.rw.u[x.id];if(p!=null&&cur2[x.id]>p)hit=x});
  S.rw.u=cur2;
  if(hit)celebrate(hit)}
function fanfare(){try{
  var A=window.AudioContext||window.webkitAudioContext;if(!A)return;
  if(!AC)AC=new A();if(AC.state==='suspended')AC.resume();
  var t0=AC.currentTime+0.03;
  [[523.25,0],[523.25,.12],[523.25,.24],[659.25,.36],[783.99,.5],[1046.5,.7]].forEach(function(n,i,a){
    var last=i===a.length-1,dur=last?0.9:0.14;
    [1,1.5].forEach(function(m,j){
      if(j&&!last)return;
      var o=AC.createOscillator(),g=AC.createGain(),t=t0+n[1];
      o.type=j?'triangle':'square';o.frequency.setValueAtTime(n[0]*(j?1:1),t);
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(j?0.05:0.08,t+0.015);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+0.02)})})
}catch(e){}}
function celebrate(x){
  var old=document.getElementById('fx');if(old)old.remove();
  var yen=step()*rate(),el=document.createElement('div');el.id='fx';
  var cols=['#FFC83D','#F7B0CF','#C4A8F5','#9ED6F2','#2B54F0','#E5483D','#2E8B3E'],h='';
  for(var i=0;i<54;i++){
    var l=Math.random()*100,d=Math.random()*0.9,du=2.2+Math.random()*1.8,w=6+Math.random()*7,r=Math.random()*360;
    h+='<i class="cf" style="left:'+l.toFixed(1)+'%;width:'+w.toFixed(1)+'px;height:'+(w*1.6).toFixed(1)+'px;background:'+cols[i%cols.length]+';animation-delay:'+d.toFixed(2)+'s;animation-duration:'+du.toFixed(2)+'s;transform:rotate('+r.toFixed(0)+'deg)"></i>'}
  el.innerHTML=h+'<div class="fxcard" style="'+kst(x)+'"><p class="fxt">おめでとう!</p><p class="fxn">'+esc(x.name)+'</p><p class="fxy"><b>'+yen+'</b>円 こうかんできるよ</p><p class="fxs">タップでとじる</p></div>';
  el.addEventListener('click',function(){el.remove()});
  document.body.appendChild(el);fanfare();
  setTimeout(function(){if(el.parentNode)el.remove()},6000)}
function stopSubs(){subs.forEach(function(u){try{u()}catch(e){}});subs=[];stopLedger()}
var LEDGER_N=150,ledUnsub=null;
function stopLedger(){if(ledUnsub){try{ledUnsub()}catch(e){}ledUnsub=null}}
/* きろくの読み込み: 合計を移し終えたら最近の150件だけ。まだなら全部(移す計算に使う) */
function syncLedger(){
  var m=aggReady()?'recent':'full';if(m===S.ledgerMode&&ledUnsub)return;
  stopLedger();S.ledgerMode=m;
  var ref=collection(fs,'ledger'),q=m==='recent'?query(ref,orderBy('ts','desc'),limit(LEDGER_N)):ref;
  ledUnsub=sub('ledger',{onSnapshot:function(next,err){return onSnapshot(q,function(s){next({docs:s.docs.map(function(d){return{id:d.id,data:function(){return d.data()}}})})},err)}},function(s){S.ledger=list(s)})}
function startSubs(){
  stopSubs();S.got={};S.err=null;
  var db=S.db;
  S.ledgerMode=null;
  subs.push(sub('kids',db.collection('kids'),function(s){S.kids=list(s).sort(byOrder);syncLedger()}));
  subs.push(sub('chores',db.collection('chores'),function(s){S.chores=list(s).sort(byOrder)}));
  subs.push(sub('reqs',db.collection('requests'),function(s){S.reqs=list(s)}));
  subs.push(sub('cfg',db.doc('settings/main'),function(s){S.cfgExists=s.exists;S.cfg=Object.assign({yenPerPoint:1,step:10},s.exists?s.data():{})}))}

onAuthStateChanged(auth,function(u){
  S.authReady=true;
  if(!u){stopSubs();S.user=null;S.db=null;S.canEdit=false;S.parent=false;S.kids=[];S.chores=[];S.reqs=[];S.ledger=[];S.got={};S.err=null;S.rw=null;S.tab='home';render(true);return}
  S.user=u;
  S.canEdit=(u.email||'').toLowerCase()===PARENT_EMAIL;
  S.parent=S.canEdit&&store('otm.mode')!=='kid';
  S.db=adapter;
  startSubs();render(true);pushRefresh()});

document.getElementById('ver').textContent=APP_VERSION;
S.sel=store('otm.kid');S.who=store('otm.who')==='kodomo'?'kodomo':'oya';
render(true);
</script>
